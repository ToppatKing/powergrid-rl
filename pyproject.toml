[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powergrid-rl"
version = "0.1.0"
description = "Custom Gymnasium Power Grid Environment with PPO Agent from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
]

# Tell setuptools which packages to include (env/, ppo/, and tests/)
[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "ppo*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
